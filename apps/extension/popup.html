<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MarketEdge</title>
  <link rel="stylesheet" href="./src/ui.css" />
  <style>body { width: 320px; padding: 14px; }</style>
</head>
<body class="stack">
  <div class="row">
    <h1 style="font-size:20px">Market<span style="color:var(--accent)">Edge</span></h1>
    <span class="small muted">Premium (demo)</span>
  </div>
  <div class="card stack">
    <div class="row"><span class="muted">Data</span><span id="status">Checking…</span></div>
    <div class="row"><span class="muted">Last scan</span><span id="scan">—</span></div>
    <div class="row"><span class="muted">Plan</span><span>Premium (demo)</span></div>
  </div>
  <button id="open" class="btn primary">Open MarketEdge</button>
  <p class="small muted" style="margin:0">Open a Polymarket event page to see MarketEdge next to each market.</p>
  <p class="disclaimer">Market analytics, not financial advice. Based on past results. 18+.</p>
  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
