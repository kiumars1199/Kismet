# Keeps MarketEdge current: pulls newly resolved markets, refits the model,
# rescans open markets, and publishes output/*.json to the `live` branch.
# Fallback data path: the engine container (engine/Dockerfile, docs/setup-notes/ops.md) is primary
# and uploads to Supabase Storage every 10 min; the web app falls back to this branch.
name: refresh

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (fits the free Actions minutes for a private repo)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # a failed refresh or data check opens an issue (docs/12)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # The key is unique per run, so the exact key never hits; restore-keys picks the newest history.
      - name: Restore market history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: marketedge-data-${{ github.run_id }}
          restore-keys: marketedge-data-

      - name: Bootstrap history (first run only, ~1 hour)
        run: |
          if [ ! -f data/sample.jsonl ]; then
            python pipeline/fetch_closed.py
            python pipeline/fetch_prices.py --per-niche 25000 --threads 8
            rm -f data/markets.jsonl
          fi

      - name: Pull newly resolved markets
        id: update
        run: python -m engine update

      # Saved even when a later step fails, so the next run doesn't re-download history.
      - name: Save market history
        if: always() && steps.update.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data
          key: marketedge-data-${{ github.run_id }}

      - name: Daily walk-forward test (re-tunes how fast old data fades)
        run: |
          if [ "$(date -u +%H)" = "06" ] || [ ! -f output/backtest.json ]; then
            python -m engine backtest
          fi

      # The flag ledger is append-only: continue from the published copy, not the one in main.
      - name: Load the published scan (ledger + scanned_at)
        run: |
          if git fetch -q --depth 1 origin live; then
            git show FETCH_HEAD:ledger.jsonl > output/ledger.jsonl 2>/dev/null || git checkout -- output/ledger.jsonl
            prev=$(git show FETCH_HEAD:flags.json | python -c 'import json,sys; print(json.load(sys.stdin)["meta"]["scanned_at"])' || true)
            echo "PREV_SCANNED_AT=$prev" >> "$GITHUB_ENV"
          fi

      - name: Refit model, scan open markets, grade the ledger
        run: |
          python -m engine fit
          python -m engine scan
          python -m engine grade

      - name: Engine and ops tests
        run: python -m pytest -q engine/tests ops/tests

      - name: Data checks (keep previous live data if these fail)
        run: python ops/checks.py output ${PREV_SCANNED_AT:+--prev-scanned-at "$PREV_SCANNED_AT"}

      - name: Publish outputs to the live branch
        run: |
          mkdir -p /tmp/pub && cp output/*.json output/*.jsonl /tmp/pub/
          cd /tmp/pub
          git init -q -b live
          git config user.name "marketedge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live

      - name: Open an issue when the refresh fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Data refresh failed $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body "The live branch was not updated; the previous scan stays published. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
