# Required check for every PR (docs/10 T-62): web lint, typecheck, unit, e2e smoke flows, Python tests.
name: web-ci

on:
  pull_request: {}
  push:
    branches: [main, final]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, unit tests, production build and the bundle budgets.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build && pnpm check:bundle && pnpm check:js   # docs/15: no secrets in .next/static; T-295: landing JS <= 150 kB gzipped

  # Demo-mode smoke flows (Chromium and WebKit); builds and serves the app itself (playwright.config.ts webServer).
  e2e-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-setup
        with:
          browsers: "true"
          extension: "true"   # e2e/trading-paper builds the extension
      - run: pnpm e2e:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-demo
          path: apps/web/test-results/
          retention-days: 7

  # Paid-flow specs against the e2e mock and `next dev`, one dev server per shard. The shards were one job after another
  # (about 18 min); as a matrix they take as long as the slowest one. Every spec still runs, none is skipped.
  e2e-paid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-setup
        with:
          browsers: "true"
      - run: |   # runner RAM and Node's default heap limit, to size the paid e2e server's heap against
          free -m
          node -p 'Math.round(require("v8").getHeapStatistics().heap_size_limit / 2 ** 20) + " MB default heap limit"'
      - run: pnpm e2e:paid --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-paid-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  # The required check. Named "web" so branch protection keeps working; green only when every job above passed.
  # `always()` makes it run even when a dependency failed or was cancelled, and the check below turns anything other
  # than success (failure, cancelled, skipped) into a failure, so a skipped dependency can never read as green.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, e2e-demo, e2e-paid]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a required job did not succeed ($r)"; exit 1; fi
          done

  # docs/15 § Secrets and supply chain: secret scan of the full history, and known-vulnerability audits.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repo moves to a GitHub organization; empty (and unused) on a personal account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - run: cd apps/web && pnpm audit --prod --audit-level high
      - run: cd apps/extension && pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt && pip-audit --no-deps --disable-pip -r ops/requirements.lock

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q engine/tests ops/tests
